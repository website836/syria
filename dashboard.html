<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفة العمليات - توجيه فرق الإسعاف والطوارئ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; width: 100vw; background-color: #121212; color: #fff; overflow: hidden; }

    /* الشريط الجانبي */
    .sidebar {
      width: 440px;
      min-width: 360px;
      background: #18181b;
      border-left: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      height: 100%;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121214;
    }
    .header h2 { font-size: 1.15rem; color: #ef4444; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-sound {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; display: inline-block; }

    /* عدادات الإحصاء */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #27272a;
      background: #18181b;
    }
    .stat-card {
      background: #27272a;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card span { font-size: 0.7rem; color: #a1a1aa; display: block; margin-bottom: 4px; }
    .stat-card strong { font-size: 1.2rem; color: #ef4444; }
    .stat-card.teams strong { color: #3b82f6; }
    .stat-card.resolved strong { color: #22c55e; }

    /* شريط تنبيه البلاغ الجديد */
    .alarm-banner {
      background: #b91c1c;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      display: none;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* قائمة البلاغات */
    .incident-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-msg { text-align: center; color: #71717a; margin-top: 40px; font-size: 0.9rem; }

    .incident-card {
      background: #202024;
      border: 1px solid #2e2e33;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .incident-card:hover { background: #27272c; }
    .incident-card.pending { border-right: 4px solid #ef4444; }
    .incident-card.active { border-right: 4px solid #f59e0b; }
    .incident-card.resolved { border-right: 4px solid #22c55e; opacity: 0.6; }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .incident-title { font-weight: bold; font-size: 0.95rem; }
    .incident-time { font-size: 0.75rem; color: #71717a; }
    .card-details { font-size: 0.85rem; color: #d4d4d8; margin-bottom: 10px; line-height: 1.5; }

    .nearest-box {
      background: #182234;
      border: 1px solid #1e3a8a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 10px;
      color: #93c5fd;
    }

    .card-actions { display: flex; flex-direction: column; gap: 8px; }
    .actions-row { display: flex; gap: 8px; }
    .btn-action {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }
    .btn-dispatch { background: #3b82f6; color: #fff; }
    .btn-dispatch:hover { background: #2563eb; }
    .btn-resolve { background: #22c55e; color: #fff; }
    .btn-gmaps { background: #374151; color: #e5e7eb; border: 1px solid #4b5563; }
    .btn-gmaps:hover { background: #4b5563; }

    #map {
      flex: 1;
      height: 100vh;
      background: #1e1e1e;
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <aside class="sidebar">
    <div class="header">
      <h2>غرفة العمليات والتوجيه</h2>
      <div class="header-actions">
        <button id="sound-toggle" class="btn-sound" onclick="toggleSound()">🔔 الصوت مفعل</button>
        <span class="live-dot"></span>
      </div>
    </div>

    <!-- شريط الإنذار الصوتي المباشر -->
    <div id="alarm-banner" class="alarm-banner">
      🚨 نداء استغاثة جديد معلق! يرجى التوجيه فوراً
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <span>بلاغات معلقة</span>
        <strong id="stat-pending">0</strong>
      </div>
      <div class="stat-card teams">
        <span>فرق جاهزة</span>
        <strong id="stat-teams">3</strong>
      </div>
      <div class="stat-card resolved">
        <span>تم إنجازها</span>
        <strong id="stat-resolved">0</strong>
      </div>
    </div>

    <div class="incident-list" id="incidents-container">
      <div class="empty-msg">بانتظار استقبال بلاغات جديدة...</div>
    </div>
  </aside>

  <!-- الخريطة -->
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. نظام الصوت والإنذار (Web Audio API)
    let audioCtx = null;
    let isSoundEnabled = true;
    let alarmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // توليد صوت نغمة طوارئ دون أي ملفات خارجية
    function playBeep(freq = 880, duration = 0.15) {
      if (!isSoundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {
        console.log("Audio waiting for user gesture");
      }
    }

    function triggerEmergencyAlarm() {
      // إطلاق نغمة مزدوجة سريعة
      playBeep(950, 0.18);
      setTimeout(() => playBeep(650, 0.22), 200);
    }

    function toggleSound() {
      initAudio();
      isSoundEnabled = !isSoundEnabled;
      document.getElementById('sound-toggle').innerText = isSoundEnabled ? "🔔 الصوت مفعل" : "🔕 مكتوم";
    }

    // التفاعل مع الصفحة لأول مرة لتفعيل صلاحية الصوت في المتصفح
    window.addEventListener('click', initAudio, { once: true });

    // 2. إعداد الخريطة وسيارات الإسعاف
    const ambulanceUnits = [
      { id: "AMB_1", name: "إسعاف 1 (معرة النعمان - المشفى)", lat: 35.6515, lng: 36.6780, status: "available" },
      { id: "AMB_2", name: "إسعاف 2 (نزلة تلمنس)", lat: 35.6390, lng: 36.7050, status: "available" },
      { id: "AMB_3", name: "إسعاف 3 (كفرنبل)", lat: 35.6100, lng: 36.5650, status: "available" }
    ];

    const map = L.map('map').setView([35.645, 36.675], 13);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Maps'
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    const markersLayer = L.layerGroup().addTo(map);
    const routesLayer = L.layerGroup().addTo(map);

    // 3. تهيئة Firebase
    const firebaseConfig = {
      databaseURL: "https://syrai-d4f85-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let incidents = [];
    let previousPendingCount = 0;

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function findNearestAmbulance(incidentLat, incidentLng) {
      let nearest = null;
      let minDistance = Infinity;

      ambulanceUnits.forEach(unit => {
        const dist = calculateDistance(incidentLat, incidentLng, unit.lat, unit.lng);
        if (dist < minDistance) {
          minDistance = dist;
          nearest = { ...unit, distanceKm: dist.toFixed(2) };
        }
      });
      return nearest;
    }

    function drawAmbulances() {
      ambulanceUnits.forEach(unit => {
        const ambIcon = L.divIcon({
          html: `<div style="background:#2563eb; color:#fff; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 0 10px rgba(0,0,0,0.5); font-size:16px;">🚑</div>`,
          className: '',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        L.marker([unit.lat, unit.lng], { icon: ambIcon }).addTo(map)
          .bindPopup(`<b>${unit.name}</b><br>الحالة: جاهز للاستجابة`);
      });
    }
    drawAmbulances();

    function renderDashboard() {
      markersLayer.clearLayers();
      const container = document.getElementById('incidents-container');
      container.innerHTML = "";

      if (incidents.length === 0) {
        container.innerHTML = '<div class="empty-msg">لا توجد بلاغات حالياً.</div>';
      }

      let pendingCount = 0;
      let resolvedCount = 0;

      incidents.forEach(item => {
        if (item.status === 'pending') pendingCount++;
        if (item.status === 'resolved') resolvedCount++;

        const nearestAmb = findNearestAmbulance(item.lat, item.lng);

        const pinColor = item.status === 'pending' ? '#ef4444' : (item.status === 'active' ? '#f59e0b' : '#22c55e');
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: 11,
          fillColor: pinColor,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.95
        }).addTo(markersLayer);

        marker.bindPopup(`
          <div style="direction: rtl; text-align: right; color: #111; font-size: 13px;">
            <strong style="color: red;">🚨 ${item.type}</strong><br>
            <b>العدد التقريبي:</b> ${item.count} شخص<br>
            <b>أقرب نقطة إسعاف:</b> ${nearestAmb.name} (${nearestAmb.distanceKm} كم)<br>
            <b>الحالة:</b> ${item.status === 'pending' ? 'بانتظار توجيه فريق' : (item.status === 'active' ? 'تم توجيه الإسعاف' : 'تم إنجازه')}
          </div>
        `);

        const card = document.createElement('div');
        card.className = `incident-card ${item.status}`;
        card.onclick = () => {
          map.flyTo([item.lat, item.lng], 16, { animate: true });
          marker.openPopup();
        };

        const gmapsDirectionUrl = `https://www.google.com/maps/dir/?api=1&origin=${nearestAmb.lat},${nearestAmb.lng}&destination=${item.lat},${item.lng}&travelmode=driving`;

        card.innerHTML = `
          <div class="card-top">
            <span class="incident-title">${item.type}</span>
            <span class="incident-time">${item.status === 'pending' ? 'عاجل' : (item.status === 'active' ? 'قيد التوجه' : 'مكتمل')}</span>
          </div>
          <div class="card-details">
            عدد الأشخاص: <strong>${item.count}</strong> | الإحداثيات: ${item.lat}, ${item.lng}
          </div>

          <div class="nearest-box">
            🚑 <b>أقرب فريق:</b> ${nearestAmb.name}<br>
            📏 <b>المسافة:</b> ${nearestAmb.distanceKm} كم (حوالي ${Math.round(nearestAmb.distanceKm * 2.5)} دقيقة وصول)
            ${item.assignedTeam ? `<br><b style="color:#f59e0b">تم تعيين: ${item.assignedTeam}</b>` : ''}
          </div>

          <div class="card-actions" onclick="event.stopPropagation()">
            <div class="actions-row">
              ${item.status === 'pending' ? `
                <button class="btn-action btn-dispatch" onclick="dispatchAmbulance('${item.id}', '${nearestAmb.name}', ${nearestAmb.lat},${nearestAmb.lng}, ${item.lat},${item.lng})">
                  توجيه أقرب إسعاف فوراً 🚀
                </button>
              ` : ''}
              ${item.status !== 'resolved' ? `
                <button class="btn-action btn-resolve" onclick="updateStatus('${item.id}', 'resolved')">إتمام البلاغ ✓</button>
              ` : '<span style="color:#22c55e; font-size:0.8rem; text-align:center;">تم إنقاذ الحالة بنجاح ✓</span>'}
            </div>
            
            <a href="${gmapsDirectionUrl}" target="_blank" class="btn-action btn-gmaps">
              فتح خط سير الإسعاف في Google Maps 🗺️
            </a>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('stat-pending').innerText = pendingCount;
      document.getElementById('stat-resolved').innerText = resolvedCount;

      // إدارة شريط الإنذار والصوت
      const banner = document.getElementById('alarm-banner');
      if (pendingCount > 0) {
        banner.style.display = 'block';
        banner.innerText = `🚨 تنبيه: يوجد ${pendingCount} بلاغ طوارئ جديد بانتظار التوجيه!`;
      } else {
        banner.style.display = 'none';
      }

      // إذا زاد عدد البلاغات الجديدة عن السابق -> دق الإنذار فوراً
      if (pendingCount > previousPendingCount) {
        triggerEmergencyAlarm();
      }
      previousPendingCount = pendingCount;
    }

    window.dispatchAmbulance = function(incidentId, teamName, ambLat, ambLng, incLat, incLng) {
      db.ref('incidents/' + incidentId).update({
        status: 'active',
        assignedTeam: teamName
      });

      routesLayer.clearLayers();
      const line = L.polyline([[ambLat, ambLng], [incLat, incLng]], {
        color: '#3b82f6',
        weight: 4,
        dashArray: '8, 8',
        opacity: 0.9
      }).addTo(routesLayer);

      map.fitBounds(line.getBounds(), { padding: [50, 50] });
    };

    db.ref('incidents').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        incidents = Object.values(data).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      } else {
        incidents = [];
      }
      renderDashboard();
    });

    window.updateStatus = function(id, newStatus) {
      db.ref('incidents/' + id).update({ status: newStatus });
      routesLayer.clearLayers();
    };
  </script>
</body>
</html>
